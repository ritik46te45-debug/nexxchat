<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="nexchat-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background rounded squircle -->
  <rect width="512" height="512" rx="128" fill="#0c0d1e" />
  
  <!-- Glow outer shape -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="url(#nexchat-grad)" stroke-width="8" opacity="0.4" />
  
  <!-- Chat Bubble with 'N' lightning shape -->
  <g transform="translate(106, 106)">
    <!-- Chat main bubble -->
    <path d="M 150 0 C 67.157 0 0 67.157 0 150 C 0 195.42 20.316 236.142 52.5 264.12 L 30 330 L 105.81 306.72 C 119.85 311.97 134.61 315 150 315 C 232.843 315 300 247.843 300 150 C 300 67.157 232.843 0 150 0 Z" fill="url(#nexchat-grad)" />
    
    <!-- Modern 'N' monogram -->
    <path d="M 95 90 L 125 90 L 175 180 L 175 90 L 205 90 L 205 210 L 175 210 L 125 120 L 125 210 L 95 210 Z" fill="#ffffff" />
  </g>
</svg>
