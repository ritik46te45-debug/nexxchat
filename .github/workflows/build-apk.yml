name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'client/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Signed Release APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK Components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "platforms;android-36" "build-tools;35.0.0" || true

      - name: Make Gradlew Executable
        run: chmod +x client/android/gradlew

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Install Client Dependencies & Build Web Assets
        run: |
          cd client
          npm install --legacy-peer-deps
          npm run build
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          cp capacitor.config.json android/app/src/main/assets/capacitor.config.json

      - name: Setup Android Release Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from repository secrets..."
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > client/android/app/nexchat-release.keystore
          elif [ ! -f "client/android/app/nexchat-release.keystore" ]; then
            echo "No keystore found. Generating dedicated CI release keystore..."
            keytool -genkeypair -v -keystore client/android/app/nexchat-release.keystore \
              -alias nexchat -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass nexchat123 -keypass nexchat123 \
              -dname "CN=NexChat, OU=Mobile, O=NexChat, L=City, ST=State, C=US"
          fi

      - name: Build Android APKs with Gradle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd client/android
          ./gradlew assembleDebug --no-daemon --stacktrace
          ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexchat-apks
          path: client/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error

      - name: Publish APK to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v-latest
          name: NexChat Latest App Builds
          files: |
            client/android/app/build/outputs/apk/debug/app-debug.apk
            client/android/app/build/outputs/apk/release/app-release.apk
