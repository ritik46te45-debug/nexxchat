name: Build Android APK

on:
  push:
    branches:
      - main
    paths:
      - 'client/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Signed Release APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Setup Android SDK Components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0" || true

      - name: Make Gradlew Executable
        run: chmod +x client/android/gradlew

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'client/package-lock.json'

      - name: Install Client Dependencies & Build Web Assets
        run: |
          cd client
          npm ci --legacy-peer-deps || npm install --legacy-peer-deps
          npm run build
          mkdir -p android/app/src/main/assets/public
          cp -r dist/* android/app/src/main/assets/public/
          cp capacitor.config.json android/app/src/main/assets/capacitor.config.json

      - name: Build Android APKs with Gradle
        run: |
          cd client/android
          ./gradlew assembleDebug --no-daemon --stacktrace
          ./gradlew assembleRelease --no-daemon --stacktrace || true

      - name: Upload APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexchat-apks
          path: client/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
